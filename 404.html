<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <style>
    :root { color-scheme: light; --bg:#F7F5F0; --ink:#16181D; --muted:#5E6573; --accent:#1A2F99; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#121316; --ink:#ECEAE4; --muted:#9CA1AA; --accent:#B5C2FF; } }
    :root[data-theme="dark"] { color-scheme: dark; --bg:#121316; --ink:#ECEAE4; --muted:#9CA1AA; --accent:#B5C2FF; }
    body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 "Segoe UI", system-ui, sans-serif; }
    main { max-width:640px; margin:0 auto; padding:72px 16px; }
    h1 { font:700 30px/1.2 Georgia, serif; margin:0 0 12px; }
    p { color:var(--muted); } a { color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Страница не найдена</h1>
    <p>Проверьте ссылку.</p>
  </main>
</body>
</html>
